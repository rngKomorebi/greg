[pytest]
testpaths = tests
# The app's modules sit at the repo root rather than in a package.
pythonpath = .
# A deprecated call works until the release that removes it. Fail as soon as
# one is made from GREG's own code, while there is still time to change it.
# Only warnings attributed to these modules count ("__main__" is the app
# script, which AppTest runs under that name), so a deprecation inside a
# dependency's own internals cannot fail the suite.
filterwarnings =
    error::DeprecationWarning:(analysis_core|physics_core|spectral_units|export_core|__main__)
    error::PendingDeprecationWarning:(analysis_core|physics_core|spectral_units|export_core|__main__)
    error::FutureWarning:(analysis_core|physics_core|spectral_units|export_core|__main__)
