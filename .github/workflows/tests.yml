name: Tests

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Every Python the app supports. 3.15 is left out on purpose: the
        # matplotlib pin (3.10.8, needed to read daplis pickles) has no wheels
        # for it. See the comment in requirements.txt.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # From the capped ranges, so each Python gets the newest dependency
      # versions it supports: what a fresh install gets today.
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Show installed versions
        run: python -m pip list

      - name: Run tests
        run: python -m pytest -q
